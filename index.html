<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>跑步穿什么</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 参考 Ahead / Duolingo：角色当主角、饱和主色、厚实 3D 按钮、粉彩卡片、打卡连胜 */
  --brand:#f2884f; --brand-dk:#d9692e; --brand-soft:#fff4ed; --brand-2:#f9b98f; --brand-3:#fde3d2;
  --ink:#2a2733;
  --muted:#6f6a78; --brand-text:#a94b1c; --danger-text:#b5452f;
  --line:#eeebe8;
  --bg:#ffffff;
  --fill:#f7f5f3;
  --good:#6fae8c; --ok:#e2b25a; --bad:#d9634f;
  --font-latin:"Nunito",system-ui,sans-serif;
  --font:"Nunito","Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid #b9a8ff;outline-offset:2px}
.app{max-width:440px;margin:0 auto;min-height:100%;padding:12px 16px 120px;display:flex;flex-direction:column;gap:16px;background:var(--bg);position:relative}
@media (min-width:600px){
  body{background:#f1eef8}
  .app{margin:28px auto;border-radius:36px;min-height:auto;box-shadow:0 30px 60px -30px rgba(43,35,64,.3)}
}

/* 顶栏 */
.top{display:flex;align-items:center;gap:8px}
.pill{display:flex;align-items:center;gap:6px;box-shadow:0 2px 6px -3px rgba(43,35,64,.15);border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:15px;min-width:0}
.pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.chunky:active{transform:scale(.98)}
.streak{margin-left:auto;font-weight:700;color:var(--brand-text);font-size:14px}
.streak.off{color:#a8a3b0}
.round{width:40px;height:40px;padding:0;justify-content:center}

/* 时间 */
.times{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.times::-webkit-scrollbar{display:none}
.t{flex:0 0 auto;box-shadow:0 2px 6px -3px rgba(43,35,64,.12);border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:7px 14px;font-weight:700;font-size:14px;color:var(--muted)}
.t[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* 角色卡 */
.stage{position:relative;border-radius:28px;padding:16px 16px 8px;overflow:hidden;background:var(--sky,#fff1c9)}
.stage.dark{color:#fff}
.stage .meta{display:flex;flex-wrap:wrap;gap:6px}
.stage .meta span{background:rgba(255,255,255,.92);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700}
.stage.dark .meta span{background:rgba(255,255,255,.14)}
.stage .meta b{font-family:var(--font-latin);font-weight:700}
.bubble{position:relative;margin:0;background:#fff;color:var(--ink);border-radius:20px;padding:13px 16px;font-size:17px;font-weight:600;line-height:1.45;box-shadow:0 6px 16px -10px rgba(43,35,64,.25);text-wrap:balance}
.bubble::after{content:"";position:absolute;left:-9px;top:50%;margin-top:-9px;border:9px solid transparent;border-right-color:#fff;border-left:0}
.bubble small{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-top:4px}
.bubble .warn{display:inline-block;margin-bottom:6px;background:#fbe9e5;color:var(--danger-text);font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px}
.mascot{display:block;width:210px;height:190px;margin:4px auto 0}
.hero2{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center;margin-top:12px}
.hero2 .mascot{width:92px;height:84px;margin:0}
.stage{padding-bottom:16px}
.best{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;margin-top:12px;border:0;border-radius:16px;background:rgba(255,255,255,.94);padding:10px 14px;font-size:14px;font-weight:700;text-align:left;color:var(--ink)}
.best b{color:var(--brand-text)}
.best .go{flex:0 0 auto;color:var(--brand-text);font-weight:700}
.best.ok{background:rgba(255,255,255,.55);cursor:default}
.stage.dark .best{background:rgba(255,255,255,.14);color:#fff}
.stage.dark .best b,.stage.dark .best .go{color:#ffd0b0}
.deco{position:absolute;inset:0;pointer-events:none;z-index:0}
.stage>*:not(.deco){position:relative;z-index:1}

/* 穿搭卡片 */
.h{font-size:19px;font-weight:700;margin:4px 0 0;letter-spacing:.2px}
.wear{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border:0;background:var(--c1);border-radius:22px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:6px;min-height:118px}
.card svg{width:44px;height:44px}
.card b{font-size:16px;font-weight:700;line-height:1.3}
.card small{font-size:12px;font-weight:700;color:var(--c3)}
.card.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:auto;gap:12px}
.card.wide svg{width:36px;height:36px;flex:0 0 36px}

.body{background:var(--fill);border-radius:24px;padding:8px 6px 4px}
.body svg{display:block;width:100%;height:auto}
.extras{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.extras span{display:flex;align-items:center;gap:6px;background:var(--fill);color:var(--ink);border-radius:999px;padding:5px 12px 5px 8px;font-size:14px;font-weight:700}
.extras svg{width:20px;height:20px}
.better{margin:10px 2px 0;font-size:13px;color:var(--muted)}
.better b{color:var(--ink);font-weight:600}
.stage .meta .det{border:0;font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--brand-text);background:rgba(255,255,255,.92);border-radius:999px;padding:3px 10px}
.stage.dark .meta .det{color:#ffd0b0;background:rgba(255,255,255,.14)}
.t.more{color:var(--ink)}
/* 提醒 */
.tips{background:var(--fill);border-radius:20px;padding:14px 16px}
.tips h3{margin:0 0 4px;font-size:13px;font-weight:700;color:var(--muted)}
.tips ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.tips li.warn{color:var(--danger-text);font-weight:600}

.rows{display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;font-weight:700;width:100%;text-align:left}
.panel{border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-top:-4px}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.days button{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:5px 10px;font-size:13px;font-weight:700;color:var(--muted)}
.days button[aria-pressed="true"]{border-color:var(--brand);color:var(--brand-dk);background:var(--brand-soft)}
.hours{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.hr{flex:0 0 46px;display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid transparent;background:transparent;border-radius:12px;padding:6px 0}
.hr .tt{font-size:11px;color:var(--muted);font-weight:700}
.hr .v{font-family:var(--font-latin);font-size:17px;font-weight:700}
.hr .bar{width:18px;height:6px;border-radius:3px}
.hr[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px}
.grid .k{font-size:12px;color:var(--muted);font-weight:700}
.grid .n{font-family:var(--font-latin);font-size:20px;font-weight:700}
.grid .n small{font-size:12px;color:var(--muted);margin-left:2px}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:4px 0 0}
.foot a{color:inherit}
.status{padding:50px 10px;text-align:center;color:var(--muted);font-weight:700}
.status.err{color:var(--bad)}

/* 底部大按钮 */
.cta{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:440px;padding:12px 16px 18px;background:linear-gradient(rgba(255,255,255,0),#fff 35%)}
@media (min-width:600px){.cta{position:sticky;transform:none;left:auto;bottom:0;margin:0 -16px -120px;width:auto;border-radius:0 0 36px 36px}}
.big{width:100%;border:0;border-radius:999px;padding:15px;font-size:16px;font-weight:700;letter-spacing:.5px;background:var(--brand);color:var(--ink);box-shadow:0 10px 24px -12px rgba(217,105,46,.7)}
.big:active{transform:scale(.98)}
.big.done{background:var(--fill);color:var(--muted);box-shadow:none}
.big.ghost{background:var(--fill);color:var(--ink);box-shadow:none}

/* 弹层 */
.overlay{position:fixed;inset:0;background:rgba(43,35,64,.4);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.overlay[hidden]{display:none}
.modal{background:#fff;width:100%;max-width:440px;border-radius:28px 28px 0 0;padding:22px 18px 26px;max-height:92%;overflow:auto}
@media (min-width:600px){.overlay{align-items:center}.modal{border-radius:28px}}
.modal h3{font-size:21px;font-weight:700;margin:0 0 14px;text-wrap:balance}
.modal .center{text-align:center}
.field{margin-bottom:16px}
.field .lab{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.opts{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.opts button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:9px 4px;font-weight:700;font-size:14px;color:var(--muted)}
.opts button[aria-pressed="true"]{border-color:var(--brand);color:var(--brand-dk);background:var(--brand-soft)}
.feel3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.feel3 button{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:8px 4px 10px;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center}
.feel3 button:hover{border-color:var(--brand)}
.feel3 svg{width:84px;height:76px}
.searchRow{display:flex;gap:8px;margin-top:12px}
.searchRow input{flex:1;min-width:0;font:inherit;font-weight:700;padding:11px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.small{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:9px 14px;font-weight:700}
.results{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.results button{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;font-weight:700}
.results .sub{color:var(--muted);font-size:13px;font-weight:600;margin-left:6px}
.msg{font-size:13px;color:var(--muted);margin-top:8px;min-height:18px;font-weight:700}
.week{display:flex;justify-content:center;gap:8px;margin:14px 0 18px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.week i{width:28px;height:28px;border-radius:50%;background:var(--fill);display:grid;place-items:center}
.week i.on{background:var(--brand)}
.streakBig{font-size:14px;font-weight:700;color:var(--brand-text);background:var(--brand-soft);display:inline-block;border-radius:999px;padding:3px 12px}
.mt{margin-top:10px}
@media (prefers-reduced-motion:no-preference){
  .mascot .bob{animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="pill chunky" id="placeBtn" aria-label="更换地点">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--brand-dk)"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg>
      <span id="placeName">正在定位…</span></button>
    <div class="pill streak off" id="streak" title="连续打卡天数">
      <svg width="18" height="18" viewBox="0 0 24 24"><g fill="currentColor"><ellipse cx="8.5" cy="9" rx="3" ry="4.6" transform="rotate(-12 8.5 9)"/><circle cx="7.6" cy="15.6" r="1.9"/><ellipse cx="15.5" cy="11" rx="3" ry="4.6" transform="rotate(12 15.5 11)"/><circle cx="16.4" cy="17.6" r="1.9"/></g></svg>
      <span><span id="streakN">0</span> 天</span></div>
    <button class="pill round chunky" id="setBtn" aria-label="我的设置">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </div>

  <div class="times" id="times" aria-label="什么时候跑"></div>

  <div class="status" id="status">正在获取天气…</div>

  <section class="stage" id="stage" hidden>
    <div class="deco" id="deco"></div>
    <div class="meta" id="meta"></div>
    <div class="hero2">
      <svg class="mascot" id="mascot" viewBox="0 0 220 200" role="img" aria-label="小团子"></svg>
      <div class="bubble" id="bubble"></div>
    </div>
    <button class="best" id="best" hidden></button>
  </section>

  <section id="wearSec" hidden>
    <h2 class="h" id="wearTitle">这样穿</h2>
    <div class="body mt" id="body"></div>
    <div class="extras" id="extras" hidden></div>
    <p class="better" id="better" hidden></p>
  </section>

  <section class="tips" id="tipsSec" hidden><h3>小提醒</h3><ul id="tips"></ul></section>

  <p class="foot">天气数据 <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · 几天后是预报，出门前再看一眼</p>

  <div class="cta" id="cta" hidden><button class="big" id="ctaBtn">跑完了，打个卡</button></div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" id="modal"></div>
</div>

<script>
(function(){
const $=s=>document.querySelector(s);
const LS={ get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
const state={ place:LS.get('runwear.place'), data:null, hourIdx:null, dayIdx:0,
  profile:Object.assign({body:0,dur:'mid',when:'any',fbCount:0}, LS.get('runwear.profile')||{}) };
const visits=(LS.get('runwear.visits')||0)+1; LS.set('runwear.visits',visits);
const WMO={0:'晴',1:'晴',2:'多云',3:'阴',45:'有雾',48:'有雾',51:'毛毛雨',53:'毛毛雨',55:'毛毛雨',56:'冻雨',57:'冻雨',61:'小雨',63:'中雨',65:'大雨',66:'冻雨',67:'冻雨',71:'小雪',73:'中雪',75:'大雪',77:'下雪',80:'阵雨',81:'阵雨',82:'强阵雨',85:'阵雪',86:'阵雪',95:'雷阵雨',96:'雷阵雨',99:'强雷暴'};
const WEEK=['周日','周一','周二','周三','周四','周五','周六'];
const NET_HINT='如果是在 Claude 里预览，请下载后用浏览器打开。';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function setStatus(m,err){ const el=$('#status'); el.hidden=!m; el.textContent=m||''; el.className='status'+(err?' err':''); }
const saveProfile=()=>LS.set('runwear.profile',state.profile);

/* ---------- 打卡 / 连胜 ---------- */
const todayStr=()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const runs=()=>LS.get('runwear.runs')||[];
function streak(){
  const set=new Set(runs()); let n=0; const d=new Date();
  if(!set.has(todayStr())) d.setDate(d.getDate()-1);
  for(;;){ const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(set.has(k)){ n++; d.setDate(d.getDate()-1); } else break; }
  return n;
}
function renderStreak(){ const n=streak(); $('#streakN').textContent=n; $('#streak').classList.toggle('off',n===0);
  const done=runs().includes(todayStr()); const b=$('#ctaBtn');
  b.textContent=done?'今天已打卡 ✓ 再跑一次也可以':'跑完了，打个卡'; b.classList.toggle('done',done); }

/* ---------- 小团子 ---------- */
function mascot(o){
  // o: {mood:'happy'|'cold'|'hot'|'wet', beanie, scarf, cap, umbrella, glasses, lamp}
  let s='<g class="bob">';
  if(o.umbrella) s+=`<path d="M150 48 V122 q0 9 -9 9" stroke="#3b3355" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M98 50 C104 10 196 10 202 50 Q189 42 176 50 Q163 42 150 50 Q137 42 124 50 Q111 42 98 50Z" fill="#45424f"/>
    <path d="M150 14 C140 24 136 38 137 46 Q143 43 150 50 Q157 43 163 46 C164 38 160 24 150 14Z" fill="#5d5a66"/>`;
  s+=`<ellipse cx="110" cy="186" rx="52" ry="7" fill="#2b2340" opacity=".1"/>
    <ellipse cx="88" cy="178" rx="15" ry="9" fill="#f49a66"/><ellipse cx="132" cy="178" rx="15" ry="9" fill="#f49a66"/>
    <ellipse cx="44" cy="124" rx="11" ry="14" fill="#f49a66" transform="rotate(-25 44 124)"/>
    <ellipse cx="176" cy="122" rx="11" ry="14" fill="#f49a66" transform="rotate(25 176 122)"/>
    <path d="M110 40 C160 40 182 78 180 120 C178 160 150 176 110 176 C70 176 42 160 40 120 C38 78 60 40 110 40Z" fill="#ffb98a"/>
    <path d="M178 112 C176 152 150 170 112 172 C150 160 168 140 172 104Z" fill="#f6a26f" opacity=".7"/>
    <ellipse cx="80" cy="70" rx="20" ry="12" fill="#ffd8bd" transform="rotate(-25 80 70)"/>`;
  // 脸
  const ey=o.cap||o.beanie?106:102;
  s+=`<ellipse cx="90" cy="${ey}" rx="8" ry="9.5" fill="#2b2340"/><ellipse cx="130" cy="${ey}" rx="8" ry="9.5" fill="#2b2340"/>
      <circle cx="87" cy="${ey-4}" r="3" fill="#fff"/><circle cx="127" cy="${ey-4}" r="3" fill="#fff"/>
      <ellipse cx="74" cy="${ey+16}" rx="9" ry="5.5" fill="#f39a8a" opacity=".55"/><ellipse cx="146" cy="${ey+16}" rx="9" ry="5.5" fill="#f39a8a" opacity=".55"/>`;
  const my=ey+18;
  if(o.mood==='cold') s+=`<path d="M100 ${my} q5 -5 10 0 t10 0" stroke="#2b2340" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  else if(o.mood==='hot') s+=`<ellipse cx="110" cy="${my+2}" rx="7" ry="8" fill="#2b2340"/><ellipse cx="110" cy="${my+6}" rx="4" ry="3" fill="#f39a8a"/>`;
  else s+=`<path d="M99 ${my-2} Q110 ${my+10} 121 ${my-2}" stroke="#2b2340" stroke-width="3.8" fill="none" stroke-linecap="round"/>`;
  if(o.glasses) s+=`<g fill="#2b2340"><rect x="74" y="${ey-10}" width="30" height="19" rx="9"/><rect x="116" y="${ey-10}" width="30" height="19" rx="9"/><rect x="102" y="${ey-5}" width="16" height="4" rx="2"/></g><path d="M80 ${ey-5} h8" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".6"/>`;
  if(o.scarf) s+=`<path d="M52 140 C80 152 140 152 168 140 L170 154 C140 166 80 166 50 154Z" fill="#f2884f"/><rect x="126" y="150" width="18" height="30" rx="7" fill="#d9692e"/>`;
  if(o.beanie) s+=`<path d="M58 84 C58 46 162 46 162 84Z" fill="#45424f"/><rect x="52" y="76" width="116" height="20" rx="10" fill="#2a2733"/><circle cx="110" cy="40" r="12" fill="#f9b98f"/>`;
  if(o.cap) s+=`<path d="M62 86 C62 48 158 48 158 86Z" fill="#45424f"/><path d="M140 82 C170 76 196 82 202 92 C180 98 154 94 140 92Z" fill="#2a2733"/>`;
  if(o.lamp){ const ly=o.beanie?86:o.cap?78:74; s+=`<circle cx="110" cy="${ly}" r="18" fill="#fff6b0" opacity=".35"/><circle cx="110" cy="${ly}" r="8" fill="#fff3a0" stroke="#3b3355" stroke-width="3"/>`; }
  if(o.mood==='hot') s+=`<path d="M170 64 C175 74 180 79 180 85 a10 10 0 0 1 -20 0 c0 -6 5 -11 10 -21Z" fill="#c9d6dc"/>`;

  const hc=hands?F('hands'):skin;
  g+=`<circle cx="45" cy="203" r="9" fill="${hc}"/><circle cx="155" cy="203" r="9" fill="${hc}"/>`;
  // 头
  g+=`<circle cx="100" cy="42" r="25" fill="${skin}"/>`;
  g+=`<path d="M72 62 C64 20 86 11 100 11 C114 11 136 20 128 62 C124 56 124 42 119 31 C107 35 93 35 81 31 C76 42 76 56 72 62Z" fill="#3b3440"/>`;
  g+=`<circle cx="91" cy="44" r="2.8" fill="#2b2340"/><circle cx="109" cy="44" r="2.8" fill="#2b2340"/><path d="M94 53 Q100 58 106 53" stroke="#2b2340" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  if(d.look.glasses) g+=`<g fill="#2b2340"><rect x="82" y="38" width="15" height="10" rx="5"/><rect x="103" y="38" width="15" height="10" rx="5"/><rect x="96" y="41" width="8" height="2.5"/></g>`;

  return `<svg viewBox="0 0 400 352" role="img" aria-label="穿搭示意：${esc(d.items.map(x=>x.part+x.name).join('，'))}"><g transform="translate(100 0)">${g}</g>${lab}</svg>`;
}

/* ---------- 定位 ---------- */
function autoLocate(fromModal){
  const say=fromModal?msg:setStatus; say('正在定位…');
  const fallback=()=>ipLocate(fromModal);
  if(!navigator.geolocation){ fallback(); return; }
  navigator.geolocation.getCurrentPosition(async pos=>{
    const {latitude:lat,longitude:lon}=pos.coords; let name='当前位置';
    try{ const j=await (await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh`)).json();
      name=j.locality||j.city||j.principalSubdivision||name; }catch(e){}
    choosePlace({lat,lon,name});
  },fallback,{enableHighAccuracy:false,timeout:8000,maximumAge:600000});
}
async function ipLocate(fromModal){
  const src=[async()=>{ const j=await (await fetch('https://get.geojs.io/v1/ip/geo.json')).json(); return {lat:+j.latitude,lon:+j.longitude,city:j.city}; },
    async()=>{ const j=await (await fetch('https://ipapi.co/json/')).json(); return {lat:+j.latitude,lon:+j.longitude,city:j.city}; }];
  for(const f of src){ try{ const r=await f(); if(isFinite(r.lat)&&isFinite(r.lon)){ choosePlace({lat:r.lat,lon:r.lon,name:(r.city||'当前位置')+'（大致）'}); return; } }catch(e){} }
  if(fromModal) msg('自动定位失败，请搜索城市。'+NET_HINT,true);
  else { setStatus(''); $('#placeName').textContent='选择地点'; openPlace(); msg('没能自动定位，请搜索城市。'+NET_HINT,true); }
}
async function search(){
  const q=$('#q').value.trim(); if(!q) return; msg('搜索中…'); $('#results').innerHTML='';
  try{
    const j=await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=zh&format=json`)).json();
    if(!j.results||!j.results.length){ msg('没找到「'+q+'」，试试英文或拼音。',true); return; }
    msg('');
    j.results.forEach(p=>{ const b=document.createElement('button');
      b.innerHTML=`${esc(p.name)}<span class="sub">${esc([p.admin1,p.country].filter(Boolean).join(' · '))}</span>`;
      b.addEventListener('click',()=>choosePlace({lat:p.latitude,lon:p.longitude,name:p.name})); $('#results').appendChild(b); });
  }catch(e){ msg('搜索失败。'+NET_HINT,true); }
}
function choosePlace(p){ state.place=p; LS.set('runwear.place',p); closeModal(); loadWeather(); }

/* ---------- 天气 ---------- */
async function loadWeather(){
  $('#placeName').textContent=state.place.name; setStatus('正在获取天气…');
  try{
    const p=state.place, vars='temperature_2m,apparent_temperature,relative_humidity_2m,dew_point_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m,wind_gusts_10m,uv_index,is_day';
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}&hourly=${vars}&wind_speed_unit=ms&timezone=auto&forecast_days=7`);
    if(!r.ok) throw new Error(r.status);
    state.data=await r.json(); setStatus('');
    const H=state.data.hourly;
    state.nowKey=new Date(Date.now()+(state.data.utc_offset_seconds||0)*1000).toISOString().slice(0,13);
    state.dates=[...new Set(H.time.map(t=>t.slice(0,10)))];
    state.nowIdx=Math.max(0,H.time.findIndex(t=>t.slice(0,13)===state.nowKey));
    state.hourIdx=state.nowIdx; buildTimes(); renderAll();
  }catch(e){ setStatus('天气获取失败。'+NET_HINT,true); }
}
const idxAt=(off,h)=>{ const d=state.dates[off]; return d?state.data.hourly.time.indexOf(`${d}T${String(h).padStart(2,'0')}:00`):-1; };
function buildTimes(){
  const nowH=+state.nowKey.slice(11,13), list=[{label:'现在',idx:state.nowIdx,ord:0}];
  const m= nowH<7 ? {label:'今早 7 点',idx:idxAt(0,7),ord:7} : {label:'明早 7 点',idx:idxAt(1,7),ord:31};
  const e= nowH<19 ? {label:'今晚 7 点',idx:idxAt(0,19),ord:19} : {label:'明晚 7 点',idx:idxAt(1,19),ord:43};
  list.push(...[m,e].sort((a,b)=>a.ord-b.ord));
  const box=$('#times'); box.innerHTML='';
  list.filter(c=>c.idx>=0).forEach(c=>{ const b=document.createElement('button'); b.className='t chunky'; b.textContent=c.label; b.dataset.idx=c.idx;
    b.addEventListener('click',()=>{ state.hourIdx=c.idx; renderAll(); }); box.appendChild(b); });
  const more=document.createElement('button'); more.className='t chunky more'; more.textContent='其它时间 ›'; more.addEventListener('click',openTimes); box.appendChild(more);
}
function openTimes(){
  openModal(`<h3 id="modalTitle">选一个时间</h3><div class="days" id="days"></div><div class="hours" id="hours"></div>
    <div class="note">数字是气温。色条：绿色适合跑，黄色还行，红色要谨慎。</div><button class="big ghost mt" id="tClose">关闭</button>`);
  renderDays(); renderHours(); $('#tClose').addEventListener('click',closeModal);
}
function openDetails(){
  const w=hourData(state.hourIdx), d=decide(w), bo=boost();
  openModal(`<h3 id="modalTitle">天气详情</h3><div class="grid">${[['气温',`${Math.round(w.t)}°`],['体感',`${Math.round(w.at)}°`],['跑起来像',`${Math.round(d.rt)}°`],
    ['风速',`${w.ws.toFixed(1)}<small>m/s</small>`],['降水概率',`${w.pp}<small>%</small>`],['紫外线',`${w.uv.toFixed(0)}`],['湿度',`${w.rh}<small>%</small>`],['露点',`${Math.round(w.dp)}°`],['阵风',`${w.wg.toFixed(0)}<small>m/s</small>`]]
    .map(([a,b])=>`<div><div class="k">${a}</div><div class="n">${b}</div></div>`).join('')}</div>
    <p class="note">跑步会发热，所以按「跑起来像」的温度来穿：体感温度 ${bo>=0?'+':'−'} ${Math.abs(bo)}°，已算上你的设置和打卡反馈。</p><button class="big ghost mt" id="dClose">关闭</button>`);
  $('#dClose').addEventListener('click',closeModal);

/* ---------- 推荐逻辑 ---------- */
function hourData(k){ const H=state.data.hourly;
  return { t:H.temperature_2m[k], at:H.apparent_temperature[k], rh:H.relative_humidity_2m[k], dp:H.dew_point_2m[k],
    pp:H.precipitation_probability[k]??0, pr:H.precipitation[k]??0, code:H.weather_code[k], ws:H.wind_speed_10m[k],
    wg:H.wind_gusts_10m[k], uv:H.uv_index[k]??0, day:H.is_day[k]===1, time:H.time[k] }; }
const boost=()=>(state.profile.dur==='long'?8:6)+(state.profile.body||0);
function score(k){ const w=hourData(k); let s=100;
  if(w.at<8) s-=(8-w.at)*3; if(w.at>18) s-=(w.at-18)*4; if(w.dp>18) s-=(w.dp-18)*5;
  s-=Math.max(0,w.pp-20)*0.5; if(w.pr>=1) s-=20; if(w.ws>5) s-=(w.ws-5)*4; if(w.uv>=6) s-=(w.uv-5)*3;
  if([95,96,99].includes(w.code)) s-=50; return Math.max(0,Math.min(100,s)); }
const scoreColor=s=>s>=75?'var(--good)':s>=50?'var(--ok)':'var(--bad)';
const TIERS=[ /* [新手衣柜里就有的, 图标, 有的话更好] */
 {min:30,line:'天很热，能少穿就少穿',top:['背心或短袖','singlet','速干背心'],bottom:['运动短裤','shorts','跑步短裤'],head:'有帽檐的帽子'},
 {min:24,line:'跑起来会热，按夏天穿',top:['短袖 T 恤','tee','速干 T 恤'],bottom:['运动短裤','shorts','跑步短裤'],head:'有帽檐的帽子'},
 {min:21,line:'不冷不热，短袖短裤最舒服',top:['短袖 T 恤','tee','速干 T 恤'],bottom:['运动短裤','shorts','跑步短裤']},
 {min:15,line:'刚出门会觉得有点凉，跑 10 分钟就暖和了',top:['薄长袖 T 恤','long','速干长袖'],bottom:['运动短裤','shorts','跑步短裤']},
 {min:10,line:'刚出门会冷，跑起来就不冷了',top:['长袖 T 恤','long','速干长袖'],bottom:['运动长裤或短裤','shorts','跑步短裤'],hands:['薄手套（可选）','跑步手套']},
 {min:5,line:'冷，记得护住手和耳朵',top:['长袖 T 恤','long','速干长袖'],outer:['薄外套','vest','防风马甲'],bottom:['运动长裤','tights','跑步紧身裤'],head:'能盖住耳朵的帽子',headIcon:'beanie',hands:['薄手套','跑步手套']},
 {min:-1,line:'很冷，要穿两层',top:['保暖内衣 + 长袖','long','速干保暖打底'],outer:['厚一点的外套','jacket','防风跑步外套'],bottom:['加绒运动裤','tights','加绒紧身裤'],head:'毛线帽',headIcon:'beanie',hands:['手套','跑步手套']},
 {min:-99,line:'非常冷，穿厚一点再出门',top:['保暖内衣 + 卫衣','long','抓绒中层'],outer:['防风外套','jacket','防风跑步外套'],bottom:['加绒运动裤','tights','加绒紧身裤'],head:'毛线帽 + 围脖',headIcon:'beanie',hands:['厚手套','跑步手套']}
];
function decide(w){
  const rt=w.at+boost(), T=TIERS.find(t=>rt>=t.min);
  const rainy=w.pp>=50||w.pr>=0.3||(w.code>=51&&w.code<=82), snowy=[71,73,75,77,85,86].includes(w.code), windy=w.ws>=5||w.wg>=10;
  let outer=T.outer?[...T.outer]:null, head=T.head||'', headIcon=T.headIcon||'cap';
  if(windy&&rt<18&&!outer) outer=['薄外套','vest','防风马甲'];
  if(rainy&&rt<24&&!snowy) outer=['带帽子的薄外套','jacket','防泼水跑步外套'];
  if(rainy&&headIcon!=='beanie'){ head='有帽檐的帽子'; headIcon='cap'; }
  if(head==='有帽檐的帽子'&&!rainy&&!(w.day&&(w.code<=1||w.uv>=6))) head='';
  const items=[], better=[];
  items.push({part:'上身',name:T.top[0],icon:T.top[1],tone:'top'}); better.push(T.top[2]);
  if(outer){ items.push({part:'外层',name:outer[0],icon:outer[1],tone:'outer'}); better.push(outer[2]); }
  items.push({part:'下身',name:T.bottom[0],icon:T.bottom[1],tone:'bottom'}); better.push(T.bottom[2]);
  if(head) items.push({part:'头部',name:head,icon:headIcon,tone:'head'});
  if(T.hands){ items.push({part:'手',name:T.hands[0],icon:'gloves',tone:'hands'}); better.push(T.hands[1]); }
  const extras=[];
  if(w.uv>=6&&w.day){ extras.push({part:'配件',name:'防晒霜',icon:'glasses',tone:'other'}); better.push('运动墨镜'); }
  if(!w.day){ extras.push({part:'配件',name:'穿浅色或亮色的衣服',icon:'tee',tone:'other'}); better.push('反光条'); }
  if(rt>=27||w.dp>=20) extras.push({part:'配件',name:'带一瓶水',icon:'water',tone:'other'});
  const mood= rt>=27?'hot': rt<10?'cold':'happy';
  const look={mood, beanie:headIcon==='beanie'&&!!head, cap:headIcon==='cap'&&!!head&&!rainy, scarf:rt<-1,
    umbrella:rainy&&!snowy, glasses:false, lamp:false};
  return {rt,rainy,snowy,windy,line:T.line,items,extras,better:[...new Set(better)],look};
}
function badReason(w){
  if([95,96,99].includes(w.code)) return '有雷暴'; if(w.at>=28||w.dp>=22) return '太闷热';
  if(w.pr>=1||w.pp>=70) return '雨比较大'; if(w.ws>=9) return '风太大'; if(w.at<=-5) return '太冷';
  if(w.day&&w.uv>=8) return '太阳太晒'; return '';
}
function tipsFor(w,d){ const t=[];
  if([95,96,99].includes(w.code)) t.push(['warn','有雷暴，别在户外跑，换个时间再去。']);
  if(w.at>=28||w.dp>=22) t.push(['warn','闷热：跑慢一点，头晕、发冷、不出汗就马上停下。']);
  if(w.at<=-10) t.push(['warn','太冷：跑短一点，路线别离家太远。']);
  if(!w.day) t.push(['','夜跑选有路灯、人多的路；没有人行道时，逆着车流方向跑。']);
  if(d.rainy) t.push(['','手机装进塑料袋，跑完马上换干衣服。']);
  if(d.windy) t.push(['','风大：先逆风出发，回程顺风。']);
  if(d.snowy) t.push(['','穿鞋底防滑的鞋，避开结冰的路。']);
  if(d.rt<5) t.push(['','先在家里活动 5 分钟再出门。']);
  if(state.profile.dur==='long'&&d.rt<21) t.push(['','跑 1 小时以上：选家附近的环线，或者腰上系一件薄外套，冷了就穿。']);
  if(d.rt<15||d.rainy||state.profile.dur==='long') t.push(['','贴身那件尽量别穿纯棉，汗湿了会冷。']);
  if(visits<=3&&d.rt<21) t.push(['','出门觉得有点冷才是穿对了，别多穿。']);
  return t.slice(0,3); }

/* ---------- 最适合跑的时间 ---------- */
function bestTime(){
  const H=state.data.hourly, today=state.dates[0];
  const pick=(date,from)=>H.time.map((t,k)=>k).filter(k=>H.time[k].startsWith(date)&&k>=from&&(+H.time[k].slice(11,13))>=5&&(+H.time[k].slice(11,13))<=21);
  let c=pick(today,state.nowIdx), di=0;
  if(!c.length){ c=pick(state.dates[1],0); di=1; }
  if(!c.length) return null;
  const idx=c.reduce((a,b)=>score(b)>score(a)?b:a);
  const w=hourData(idx);
  const feel=w.at<0?'很冷':w.at<8?'偏冷':w.at<14?'有点凉':w.at<20?'凉爽':w.at<26?'暖和':'偏热';
  const why=[feel, w.ws<2?'几乎没风':w.ws<5?'风小':'风大'];
  if(!(w.code>=51&&w.code<=99)&&w.pp<20) why.push('不下雨');
  return {idx, label:(di===0?'今天':'明天')+' '+(+H.time[idx].slice(11,13))+' 点', why:why.join('、')};
}

/* ---------- 场景 ---------- */
function sceneFor(w,d){
  if(!w.day) return {bg:'#2a2733',dark:true,deco:[[40,40],[300,30],[340,90],[80,110],[260,140]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2" fill="#fff" opacity=".5"/>`).join('')+'<circle cx="335" cy="44" r="16" fill="#f3e6d8"/><circle cx="344" cy="38" r="14" fill="#2a2733"/>'};
  const cloud=(x,y,s,c)=>`<g transform="translate(${x} ${y}) scale(${s})" fill="${c}"><circle cx="0" cy="0" r="16"/><circle cx="20" cy="-8" r="20"/><circle cx="42" cy="2" r="14"/><rect x="-8" y="0" width="56" height="16" rx="8"/></g>`;
  if(d.snowy) return {bg:'#f6f3f0',deco:Array.from({length:10},(_,i)=>`<circle cx="${(i*67)%380}" cy="${30+(i*41)%200}" r="3.5" fill="#fff"/>`).join('')};
  if(d.rainy) return {bg:'#f3f1ef',deco:cloud(285,34,.9,'#e7e3df')+Array.from({length:10},(_,i)=>`<path d="M${30+(i*53)%340} ${70+(i*37)%160} l-4 10" stroke="#d6d1cc" stroke-width="3" stroke-linecap="round"/>`).join('')};
  if(w.code>=2) return {bg:'#fbf6f1',deco:cloud(285,40,.95,'#fff')+cloud(14,150,.6,'#fff')};
  return {bg:'#fff4ed',deco:'<circle cx="330" cy="46" r="22" fill="#fde3d2"/>'};
}

/* ---------- 渲染 ---------- */
function renderAll(){
  const k=state.hourIdx, w=hourData(k), d=decide(w), s=score(k);
  ['#stage','#wearSec','#cta'].forEach(id=>$(id).hidden=false);
  const sc=sceneFor(w,d), st=$('#stage');
  st.style.setProperty('--sky',sc.bg); st.classList.toggle('dark',!!sc.dark);
  $('#deco').innerHTML=`<svg width="100%" height="100%" viewBox="0 0 380 360" preserveAspectRatio="xMidYMid slice">${sc.deco}</svg>`;
  const di=state.dates.indexOf(w.time.slice(0,10)), dt=new Date(w.time.slice(0,10)+'T12:00:00Z');
  const when=k===state.nowIdx?'现在':(di===0?'今天':di===1?'明天':di===2?'后天':WEEK[dt.getUTCDay()])+' '+w.time.slice(11,16);
  const cond=[w.ws<2?'几乎没风':w.ws<5?'有一点风':w.ws<8?'风比较大':'大风'];
  if(!(w.code>=51&&w.code<=99)) cond.push(w.pp<20?'不会下雨':w.pp<50?'可能下点雨':'大概率下雨');
  $('#meta').innerHTML=`<span>${when}</span><span><b>${Math.round(w.t)}°</b> ${WMO[w.code]||''}</span>`+cond.map(c=>`<span>${c}</span>`).join('')+'<button class="det" id="detBtn">详情 ›</button>';
  $('#detBtn').onclick=openDetails;
  const why=badReason(w);
  $('#bubble').innerHTML=`${s<50&&why?`<span class="warn">不太适合跑步 · ${why}</span><br>`:''}${esc(d.line)}<small>跑起来的感觉像 ${Math.round(d.rt)}°</small>`;
  $('#mascot').innerHTML=mascot(d.look);
  const bt=bestTime(), be=$('#best');
  if(bt){ be.hidden=false;
    if(bt.idx===k){ be.className='best ok'; be.innerHTML=`这就是${bt.label.startsWith('今天')?'今天':'明天'}最适合跑的时间 ✓`; be.onclick=null; }
    else { be.className='best'; be.innerHTML=`<span><b>${bt.label}</b>更适合跑：${bt.why}</span><span class="go">看看 ›</span>`;
      be.onclick=()=>{ state.hourIdx=bt.idx; renderAll(); }; }
  } else be.hidden=true;
  $('#wearTitle').textContent=(k===state.nowIdx?'现在':when)+'这样穿';
  $('#body').innerHTML=bodyFigure(d);
  const ex=$('#extras'); ex.hidden=!d.extras.length;
  ex.innerHTML=d.extras.map(x=>`<span>${icon(x.icon,'other')}${esc(x.name)}</span>`).join('');
  const bt2=$('#better'); bt2.hidden=!d.better.length; bt2.innerHTML='有的话更好：<b>'+d.better.map(esc).join('、')+'</b>';
  const tips=tipsFor(w,d); $('#tipsSec').hidden=!tips.length;
  $('#tips').innerHTML=tips.map(([c,t])=>`<li class="${c}">${esc(t)}</li>`).join('');
  [...$('#times').children].forEach(b=>b.setAttribute('aria-pressed',+b.dataset.idx===k));
  state.dayIdx=Math.max(0,di); renderStreak();
}
function renderDays(){ const H=state.data.hourly, box=$('#days'); if(!box) return; box.innerHTML='';
  state.dates.forEach((d,i)=>{ const dt=new Date(d+'T12:00:00Z');
    const temps=H.time.map((t,k)=>t.startsWith(d)?H.temperature_2m[k]:null).filter(v=>v!=null);
    const b=document.createElement('button'); b.setAttribute('aria-pressed',i===state.dayIdx);
    b.textContent=`${i===0?'今天':i===1?'明天':WEEK[dt.getUTCDay()]} ${Math.round(Math.min(...temps))}–${Math.round(Math.max(...temps))}°`;
    b.addEventListener('click',()=>{ state.dayIdx=i; [...box.children].forEach((x,j)=>x.setAttribute('aria-pressed',j===i)); renderHours(); });
    box.appendChild(b); }); }
function renderHours(){ const H=state.data.hourly, d=state.dates[state.dayIdx];
  let idxs=H.time.map((t,k)=>t.startsWith(d)?k:-1).filter(k=>k>=0);
  if(state.dayIdx===0) idxs=idxs.filter(k=>k>=state.nowIdx);
  const box=$('#hours'); if(!box) return; box.innerHTML='';
  idxs.forEach(k=>{ const b=document.createElement('button'); b.className='hr'; b.setAttribute('aria-pressed',k===state.hourIdx);
    b.innerHTML=`<span class="tt">${H.time[k].slice(11,13)}时</span><span class="v">${Math.round(H.temperature_2m[k])}°</span><span class="bar" style="background:${scoreColor(score(k))}"></span>`;
    b.addEventListener('click',()=>{ state.hourIdx=k; closeModal(); renderAll(); window.scrollTo({top:0,behavior:'smooth'}); });
    box.appendChild(b); }); }

window.__runwear={decide,state,celebrate,openCheckin};
renderStreak();
if(state.place) loadWeather(); else autoLocate(false);
})();
</script>
